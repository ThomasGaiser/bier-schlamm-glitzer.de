<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --neon-pink: #f85cbc;
  --neon-green: #abf64c;
  --neon-orange: #ff4f28;
  --dark-bg: #0a0a0f;
  --dark-card: #13131a;
  --dark-border: #2a2a3a;
  --text-main: #f0eeff;
  --text-muted: #8888aa;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  background-color: var(--dark-bg);
  color: var(--text-main);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2.5rem 1.25rem;
  text-align: center;
  overflow-x: hidden;
}

/* subtle radial glow behind avatar */
body::before {
  content: '';
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 420px;
  height: 420px;
  background: radial-gradient(circle, rgba(248,92,188,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  max-width: 420px;
  width: 100%;
}

/* Avatar */
.avatar-wrap {
  position: relative;
  width: 180px;
  height: 180px;
  margin-bottom: 2rem;
}

.avatar-ring {
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  background: conic-gradient(
    #ff4f28 0deg,
    #f85cbc 90deg,
    #abf64c 200deg,
    #ff4f28 360deg
  );
  animation: spin 6s linear infinite;
  z-index: 0;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.avatar-inner {
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: var(--dark-bg);
  z-index: 1;
}

.avatar-img {
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center top;
  z-index: 2;
  width: calc(100% - 12px);
  height: calc(100% - 12px);
}

/* Handle */
.handle {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 1.25rem;
}

/* Main headline */
.headline {
  font-size: clamp(1.6rem, 6vw, 2.2rem);
  font-weight: 900;
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin-bottom: 0.75rem;
}

.headline .w1 { color: #ff4f28; }
.headline .w2 { color: #abf64c; }
.headline .w3 { color: #f85cbc; }

/* Subtext */
.sub {
  font-size: clamp(1rem, 3.5vw, 1.2rem);
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 2.5rem;
  max-width: 340px;
}

/* CTA */
.cta-btn {
  display: inline-block;
  background: var(--neon-pink);
  color: #fff;
  font-size: 1rem;
  font-weight: 800;
  text-decoration: none;
  padding: 0.9rem 2rem;
  border-radius: 6px;
  letter-spacing: 0.02em;
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s, color 0.2s;
  box-shadow: 0 0 30px rgba(248,92,188,0.35);
  margin-bottom: 2.5rem;
}
.cta-btn:hover {
  background: #abf64c;
  color: #0a0a0f;
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 40px rgba(171,246,76,0.4);
}
.cta-btn:active { transform: scale(0.98); }

/* Social links */
.social-row {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 3rem;
}
.social-link {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  transition: color 0.2s;
}
.social-link:hover { color: var(--neon-pink); }

/* Footer */
footer {
  font-size: 0.68rem;
  color: var(--text-muted);
  opacity: 0.5;
  line-height: 1.8;
}
footer a {
  color: var(--text-muted);
  text-decoration: underline;
  text-underline-offset: 2px;
}
footer a:hover { color: var(--text-main); opacity: 1; }
</style>
</head>
